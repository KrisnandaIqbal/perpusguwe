<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Mockup landing page</title>
<style>
:root{--page:#F9FBFC;--panel:#EEF1F6;--ink:#151922;--blue:#0F3FB4;--border:#E3E7EE}
*{box-sizing:border-box;margin:0}
body{width:2400px;height:1500px;background:var(--panel);font-family:"Plus Jakarta Sans","Segoe UI",sans-serif;color:var(--ink);position:relative;overflow:hidden}
.win{position:absolute;background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 30px 55px rgba(25,37,58,.18)}
.bar{height:44px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 18px}
.bar i{width:12px;height:12px;border-radius:50%;background:var(--border)}
.bar span{margin-left:14px;flex:1;max-width:420px;height:26px;border-radius:999px;background:var(--panel);font-size:13px;line-height:26px;padding:0 14px;color:#5B6272}
.win img{display:block;width:100%}
.phone{position:absolute;background:var(--ink);border-radius:64px;padding:16px;box-shadow:0 30px 55px rgba(25,37,58,.28)}
.phone img{display:block;width:100%;border-radius:50px}
.cap{position:absolute;font-size:22px;font-weight:700;letter-spacing:.01em}
.cap small{display:block;font-size:16px;font-weight:400;color:#5B6272;margin-top:4px}
h1{position:absolute;left:100px;top:70px;font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:56px;letter-spacing:-.01em}
</style></head><body>
<h1>Perpustakaan Kemnaker</h1>
<div class="win" style="left:100px;top:200px;width:1260px"><div class="bar"><i></i><i></i><i></i><span></span></div><img src="shots/desktop-atas.png"></div>
<div class="win" style="left:640px;top:600px;width:1260px"><div class="bar"><i></i><i></i><i></i><span></span></div><img src="shots/desktop-gulir.png"></div>
<div class="phone" style="left:1900px;top:140px;width:400px"><img src="shots/ponsel-atas.png"></div>
<div class="cap" style="left:100px;top:1160px">Hero<small>Foto ruang baca, pencarian, dan kata kunci populer.</small></div>
<div class="cap" style="left:1880px;top:1380px">Ponsel<small>Navbar menyatu dengan halaman, menjadi kaca saat digulir.</small></div>
</body></html>
